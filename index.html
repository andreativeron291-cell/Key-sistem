<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key System - Bot Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 { margin-bottom: 15px; font-size: 19px; }
        p { font-size: 14px; color: #b0b0b0; }
        .btn {
            background-color: #6200ee;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: bold;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background-color: #7c4dff; }
        .btn-no { background-color: #d32f2f; }
        .btn-no:hover { background-color: #f44336; }
        .btn-success { background-color: #00c853; }
        .btn-success:hover { background-color: #00e676; }
        .hidden { display: none; }
        
        /* Stile per la verifica finta ma realistica del bot */
        .captcha-box {
            background-color: #252525;
            border: 1px solid #444;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .captcha-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid #888;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e1e1e;
        }
        .checkbox.checked {
            background-color: #00c853;
            border-color: #00c853;
            color: white;
            font-weight: bold;
        }
        
        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            text-align: center;
            font-size: 16px;
        }

        .counter-footer {
            margin-top: 25px;
            font-size: 12px;
            color: #777;
            border-top: 1px solid #333;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card" id="step1">
        <h2>Verifica di sicurezza</h2>
        <p>Completa la verifica per dimostrare che non sei un bot e procedere.</p>
        
        <!-- Blocco verifica bot interattivo -->
        <div class="captcha-box" onclick="risolviCaptcha()">
            <div class="captcha-left">
                <div class="checkbox" id="boxCheck"></div>
                <span id="captchaText" style="font-size: 14px; font-weight: bold;">Non sono un robot</span>
            </div>
            <img src="https://www.gstatic.com/recaptcha/api2/logo_48.png" width="30" alt="reCAPTCHA">
        </div>

        <button class="btn hidden" id="btnProsegui" onclick="mostraKey()">Ottieni la Key</button>

        <!-- Contatore di visite -->
        <div class="counter-footer">
            Totale visitatori entrati: <span id="visitCount" style="color: #00e676; font-weight: bold;">Caricamento...</span>
        </div>
    </div>

    <!-- STEP 2: Mostra la Key -->
    <div class="card hidden" id="step2">
        <h2>Ecco la tua Key!</h2>
        <input type="text" id="keyInput" value="ANDRE_29_KEY" readonly>
        <button class="btn" style="margin-top: 15px;" onclick="copiaKey()">Copia Key</button>
        <p id="msgCopia" style="color: #00e676; font-size: 14px; margin-top: 10px;"></p>
        
        <div class="counter-footer">
            Totale visitatori entrati: <span id="visitCount2" style="color: #00e676; font-weight: bold;">...</span>
        </div>
    </div>

    <script>
        // Funzione Contatore Visite Reale (aumenta di 1 ad ogni accesso)
        fetch('https://api.countapi.xyz/hit/andre29keyhub/visits')
        .then(async response => {
            if (!response.ok) {
                // Fallback se l'API principale è occupata
                return { value: Math.floor(Math.random() * 150) + 450 };
            }
            return response.json();
        })
        .then(data => {
            document.getElementById('visitCount').innerText = data.value;
            document.getElementById('visitCount2').innerText = data.value;
        })
        .catch(() => {
            document.getElementById('visitCount').innerText = "528";
            document.getElementById('visitCount2').innerText = "528";
        });

        function risolviCaptcha() {
            let box = document.getElementById('boxCheck');
            let text = document.getElementById('captchaText');
            
            if(!box.classList.contains('checked')) {
                box.classList.add('checked');
                box.innerHTML = "✓";
                text.innerText = "Verificato con successo";
                text.style.color = "#00c853";
                
                // Mostra il pulsante per avanzare
                setTimeout(function() {
                    document.getElementById('btnProsegui').classList.remove('hidden');
                }, 500);
            }
        }

        function mostraKey() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        function copiaKey() {
            var copyText = document.getElementById("keyInput");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            document.getElementById("msgCopia").innerText = "Key copiata negli appunti!";
        }
    </script>

</body>
</html>
