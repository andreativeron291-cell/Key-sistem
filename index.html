<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        h2 { margin-bottom: 20px; font-size: 22px; }
        .btn {
            background-color: #6200ee;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:hover { background-color: #7c4dff; }
        .btn-no { background-color: #d32f2f; }
        .btn-no:hover { background-color: #f44336; }
        .hidden { display: none; }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            text-align: center;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="card" id="step1">
        <h2>Vuoi guardare una pubblicità per ottenere la Key?</h2>
        <button class="btn" onclick="sceltaSi()">Sì</button>
        <button class="btn btn-no" onclick="sceltaNo()">No</button>
    </div>

    <div class="card hidden" id="step2">
        <h2>Pubblicità in corso...</h2>
        <p>Attendi 3 secondi...</p>
    </div>

    <div class="card hidden" id="step3">
        <h2>Ecco la tua Key!</h2>
        <input type="text" id="keyInput" value="ANDRE_29_KEY" readonly>
        <button class="btn" style="margin-top: 15px;" onclick="copiaKey()">Copia Key</button>
        <p id="msgCopia" style="color: #00e676; font-size: 14px; margin-top: 10px;"></p>
    </div>

    <script>
        function sceltaNo() {
            alert("Hai scelto di no. Accesso negato.");
            window.location.href = "https://www.google.com"; // Ti fa uscire reindirizzandoti su Google
        }

        function sceltaSi() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');

            // Simula il tempo di una pubblicità (es. 3 secondi)
            setTimeout(function() {
                document.getElementById('step2').classList.add('hidden');
                document.getElementById('step3').classList.remove('hidden');
            }, 3000); 
            
            // Nota: Se vuoi inserire un vero link pubblicitario (es. Linkvertise o Adsterra), 
            // puoi sostituire il blocco del timer con: window.location.href = "IL_TUO_LINK_PUBBLICITARIO";
        }

        function copiaKey() {
            var copyText = document.getElementById("keyInput");
            copyText.select();
            copyText.setSelectionRange(0, 99999); // Per dispositivi mobili
            navigator.clipboard.writeText(copyText.value);
            
            document.getElementById("msgCopia").innerText = "Key copiata negli appunti!";
        }
    </script>

</body>
</html>
