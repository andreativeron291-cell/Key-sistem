<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key System - NoiCompriamoAuto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }
        h2 { margin-bottom: 15px; font-size: 19px; }
        p { font-size: 14px; color: #b0b0b0; }
        .btn {
            background-color: #6200ee;
            color: white;
            border: none;
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: bold;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background-color: #7c4dff; }
        .btn-no { background-color: #d32f2f; }
        .btn-no:hover { background-color: #f44336; }
        .btn-success { background-color: #00c853; }
        .btn-success:hover { background-color: #00e676; }
        .hidden { display: none; }
        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            text-align: center;
            font-size: 16px;
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* Proporzione 16:9 */
            height: 0;
            margin-top: 15px;
            margin-bottom: 15px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- STEP 1: Scelta Sì / No -->
    <div class="card" id="step1">
        <h2>Vuoi guardare la pubblicità di NoiCompriamoAuto.it con Enrico Papi per ottenere la Key?</h2>
        <button class="btn" onclick="mostraPubblicita()">Sì</button>
        <button class="btn btn-no" onclick="sceltaNo()">No</button>
    </div>

    <!-- STEP 2: Schermata con il video della pubblicità -->
    <div class="card hidden" id="step2">
        <h2>Spot Ufficiale</h2>
        <p>Guarda la pubblicità qui sotto e poi clicca per ottenere la key.</p>
        
        <!-- Video di YouTube incorporato dello spot di Enrico Papi / NoiCompriamoAuto -->
        <div class="video-container">
            <iframe src="https://youtu.be/jjcCdIkr_TY?is=ZPYlSvkjxCiu_qNO" title="NoiCompriamoAuto Enrico Papi" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>

        <button class="btn btn-success" onclick="mostraKey()">Ottieni la Key</button>
    </div>

    <!-- STEP 3: Mostra la Key -->
    <div class="card hidden" id="step3">
        <h2>Ecco la tua Key!</h2>
        <input type="text" id="keyInput" value="ANDRE_29_KEY" readonly>
        <button class="btn" style="margin-top: 15px;" onclick="copiaKey()">Copia Key</button>
        <p id="msgCopia" style="color: #00e676; font-size: 14px; margin-top: 10px;"></p>
    </div>

    <script>
        function sceltaNo() {
            alert("Hai scelto di no. Accesso negato.");
            window.location.href = "https://www.google.com";
        }

        function mostraPubblicita() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        function mostraKey() {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');
        }

        function copiaKey() {
            var copyText = document.getElementById("keyInput");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            document.getElementById("msgCopia").innerText = "Key copiata negli appunti!";
        }
    </script>

</body>
</html>
